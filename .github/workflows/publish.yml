name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Only one publish at a time; never cancel one mid-flight.
concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies

      # GitHub Packages has no "already published" guard of its own — publishing
      # an existing version fails the whole job, so check first and no-op instead.
      - name: Check whether this version is already published
        id: check
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@watchborne/electrons@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks
        if: steps.check.outputs.published == 'false'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:ci

      - name: Build
        if: steps.check.outputs.published == 'false'
        run: npm run build

      - name: Publish to GitHub Packages
        if: steps.check.outputs.published == 'false'
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Tag and create GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      # Best-effort: lets charge-points-frontend's update-electrons-dependency
      # workflow pick this up automatically. Requires NPM_TOKEN to carry repo
      # scope on charge-points-frontend; skip quietly if it doesn't.
      - name: Notify charge-points-frontend
        if: steps.check.outputs.published == 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh api repos/watchborne/charge-points-frontend/dispatches \
            -f event_type=electrons-released \
            -f "client_payload[version]=v$VERSION"
