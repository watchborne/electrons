name: Build, Lint, Format and Tests for Pull Requests

# Pull requests only. There is deliberately no `push: main` trigger: a
# `pull_request` run tests the merge ref (PR head already merged into base),
# so re-running everything after the merge re-verifies a tree that was just
# verified. Nothing downstream depended on it either — this package only
# publishes on a manual `workflow_dispatch` (release.yml), never off a push
# to main. `main`'s branch protection requires branches to be up to date
# before merging, which is what makes the merge-ref result trustworthy at
# merge time — see charge-points-server's and charge-points-frontend's own
# workflows for the same reasoning.
on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

# Supersede in-flight runs when a PR is pushed to again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Actions bills per job, rounded UP to the whole minute. The four checks below
# used to run as four separate jobs — lint-format, typecheck, build,
# unit-tests — each paying its own setup-node + npm ci for a few seconds of
# real work, which billed four minutes for well under one minute of compute.
# They now share a single job and a single install, the same sizing already
# applied in charge-points-server's and charge-points-frontend's workflows.
#
# `main`'s branch protection required-check contexts must be updated from the
# four old job names to `checks` in the same change that merges this —
# otherwise the old names never report again and every future PR blocks
# waiting on required checks that no longer exist.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run checks
        uses: ./.github/workflows/composites/run-checks
