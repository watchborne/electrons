name: Build, Lint, Format and Tests for Pull Requests

# Pull requests only. There is deliberately no `push: main` trigger: a
# `pull_request` run tests the merge ref (PR head already merged into base),
# so re-running everything after the merge re-verifies a tree that was just
# verified. Nothing downstream depended on it either — this package only
# publishes on a manual `workflow_dispatch` (release.yml), never off a push
# to main. `main`'s branch protection requires branches to be up to date
# before merging, which is what makes the merge-ref result trustworthy at
# merge time — see charge-points-server's and charge-points-frontend's own
# workflows for the same reasoning.
on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

# Supersede in-flight runs when a PR is pushed to again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run lint and format
        uses: ./.github/workflows/composites/run-lint-format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run typecheck
        uses: ./.github/workflows/composites/run-typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run build
        uses: ./.github/workflows/composites/run-build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        uses: ./.github/workflows/composites/run-tests/unit
