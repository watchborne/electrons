name: Build, Lint, Format and Tests for Pull Requests

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

# Supersede in-flight runs when a PR is pushed to again — cancel-in-progress is
# scoped to pull_request events so every commit landed on main is still verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions bills per job, rounded UP to the whole minute. The four checks below
# used to run as four separate jobs — lint-format, typecheck, build,
# unit-tests — each paying its own setup-node + npm ci for a few seconds of
# real work, which billed four minutes for well under one minute of compute.
# They now share a single job and a single install, the same sizing already
# applied in charge-points-server's and charge-points-frontend's workflows.
#
# `main`'s branch protection required-check contexts must be updated from the
# four old job names to `checks` in the same change that merges this —
# otherwise the old names never report again and every future PR blocks
# waiting on required checks that no longer exist.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run checks
        uses: ./.github/workflows/composites/run-checks
