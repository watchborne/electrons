name: "Install dependencies"
description: "Set up Node.js and install dependencies with npm cache"

runs:
  using: "composite"

  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: "package.json"
        cache: "npm"
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
