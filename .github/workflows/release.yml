name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  setup-and-bump:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.setup.outputs.version }}
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Normalize and validate version
        id: setup
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${INPUT_VERSION#v}"
          # Validate semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $INPUT_VERSION. Expected: major.minor.patch (e.g., 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Bump version in package.json
        run: |
          npm version ${{ steps.setup.outputs.version }} --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.setup.outputs.version }}"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git tag "${{ steps.setup.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.setup.outputs.tag }}"

  verify-version:
    runs-on: ubuntu-26.04
    needs:
      - setup-and-bump
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [[ "${{ needs.setup-and-bump.outputs.tag }}" != "$PKG_VERSION" ]]; then
            echo "::error::Release tag (${{ needs.setup-and-bump.outputs.tag }}) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "✓ Tag ${{ needs.setup-and-bump.outputs.tag }} matches package.json version $PKG_VERSION"

  build:
    runs-on: ubuntu-26.04
    needs:
      - setup-and-bump
      - verify-version
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies

      - name: Run checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:ci

      - name: Build
        run: npm run build

  publish:
    runs-on: ubuntu-26.04
    needs:
      - build
      - setup-and-bump
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies

      # dist/ is gitignored and the build job runs on its own runner, so the
      # artifact has to be rebuilt here or npm would pack a dist-less package.
      - name: Build
        run: npm run build

      - name: Pack and verify the tarball ships dist/
        env:
          TARBALL: watchborne-electrons-${{ needs.setup-and-bump.outputs.version }}.tgz
        run: |
          npm pack
          for entry in dist/index.js dist/index.cjs dist/index.d.ts dist/index.d.cts dist/tokens.css tailwind-preset.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "package/$entry"; then
              echo "::error::$entry is missing from $TARBALL - the published package would be unusable"
              exit 1
            fi
          done

      # Publish the verified tarball itself, so what consumers install is
      # exactly what the step above checked.
      - name: Publish package
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: watchborne-electrons-${{ needs.setup-and-bump.outputs.version }}.tgz
        run: npm publish "$TARBALL"

  generate-release:
    runs-on: ubuntu-26.04
    needs:
      - publish
      - setup-and-bump
    outputs:
      version: ${{ needs.setup-and-bump.outputs.tag }}
    steps:
      # The tag already exists (pushed by the previous job), so no checkout is
      # needed: GH_REPO points `gh` at this repository.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup-and-bump.outputs.tag }}
        # Notes come from GitHub's generate-notes API (merged PRs since the
        # previous release), same as charge-points-server and -frontend. Each PR
        # URL is rewritten into an explicit `[#N](url)` link. The release is
        # titled with the tag (`v0.39.2`) and its description opens with
        # `## [0.39.2](<compare url>) (2026-10-23)`, the previous tag being read
        # from the generated "Full Changelog" line.
        run: |
          VERSION="${TAG#v}"
          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          NOTES=$(printf '%s\n' "$NOTES" | sed -E "s|https://github\.com/${GITHUB_REPOSITORY}/pull/([0-9]+)|[#\1](&)|g")
          PREVIOUS_TAG=$(printf '%s\n' "$NOTES" | sed -nE "s|.*/compare/(.+)\.\.\.${TAG}\$|\1|p" | tail -n1)
          if [ -n "$PREVIOUS_TAG" ]; then
            HEADER="## [$VERSION](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}) ($(date -u +%F))"
          else
            HEADER="## $VERSION ($(date -u +%F))"
          fi
          gh release create "$TAG" --verify-tag --latest --title "$TAG" \
            --notes "$(printf '%s\n\n%s' "$HEADER" "$NOTES")"

  notify-dependents:
    runs-on: ubuntu-26.04
    needs:
      - generate-release
      - setup-and-bump
    steps:
      - name: Notify charge-points-frontend
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup-and-bump.outputs.tag }}
        run: |
          gh api repos/watchborne/charge-points-frontend/dispatches \
            -f event_type=electrons-released \
            -f "client_payload[version]=$VERSION"
