name: Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  setup-and-bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup.outputs.version }}
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Normalize and validate version
        id: setup
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${INPUT_VERSION#v}"
          # Validate semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $INPUT_VERSION. Expected: major.minor.patch (e.g., 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Bump version in package.json
        run: |
          npm version ${{ steps.setup.outputs.version }} --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.setup.outputs.version }}"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git tag "${{ steps.setup.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.setup.outputs.tag }}"

  verify-version:
    runs-on: ubuntu-latest
    needs:
      - setup-and-bump
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [[ "${{ needs.setup-and-bump.outputs.tag }}" != "$PKG_VERSION" ]]; then
            echo "::error::Release tag (${{ needs.setup-and-bump.outputs.tag }}) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "✓ Tag ${{ needs.setup-and-bump.outputs.tag }} matches package.json version $PKG_VERSION"

  build:
    runs-on: ubuntu-latest
    needs:
      - setup-and-bump
      - verify-version
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies

      - name: Run checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:ci

      - name: Build
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - setup-and-bump
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - name: Install dependencies
        uses: ./.github/workflows/composites/install-dependencies

      # dist/ is gitignored and the build job runs on its own runner, so the
      # artifact has to be rebuilt here or npm would pack a dist-less package.
      - name: Build
        run: npm run build

      - name: Pack and verify the tarball ships dist/
        env:
          TARBALL: watchborne-electrons-${{ needs.setup-and-bump.outputs.version }}.tgz
        run: |
          npm pack
          for entry in dist/index.js dist/index.cjs dist/index.d.ts dist/index.d.cts dist/tokens.css tailwind-preset.js; do
            if ! tar -tzf "$TARBALL" | grep -qx "package/$entry"; then
              echo "::error::$entry is missing from $TARBALL - the published package would be unusable"
              exit 1
            fi
          done

      # Publish the verified tarball itself, so what consumers install is
      # exactly what the step above checked.
      - name: Publish package
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: watchborne-electrons-${{ needs.setup-and-bump.outputs.version }}.tgz
        run: npm publish "$TARBALL"

  generate-release:
    runs-on: ubuntu-latest
    needs:
      - publish
      - setup-and-bump
    outputs:
      version: ${{ needs.setup-and-bump.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup-and-bump.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli@^5

      - name: Generate changelog
        id: changelog
        run: |
          # HEAD is tagged with the release version, so conventional-changelog
          # treats that tag as an already-published release. Use --release-count 2
          # so the release being cut (previous tag..current tag) is included.
          #
          # v0.2.2's and v0.3.0's bodies came out empty because the
          # conventional subject lives on the PR merge commit here, and
          # conventional-changelog drops merge commits unless told otherwise
          # (scripts/changelog-config.mjs).
          #
          # The section wanted is also at no fixed position or header level:
          # the Angular writer heads a release `# ` when its patch is 0 and
          # `## ` otherwise, and an empty "still unreleased" section can
          # precede the real one. So take the first section (either level)
          # with non-blank content under its header, the filter
          # watchborne/charge-points-frontend and charge-points-server settled
          # on (see the latter's #377/#382).
          CHANGELOG=$(conventional-changelog -p angular -n scripts/changelog-config.mjs --release-count 2 | awk '
            /^# |^## / {
              if (has_content) { print header; print body; exit }
              header = $0; body = ""; has_content = 0; next
            }
            {
              body = body $0 "\n"
              if ($0 !~ /^[[:space:]]*$/) has_content = 1
            }
            END { if (has_content) { print header; print body } }
          ')
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            CHANGELOG="Release ${{ needs.setup-and-bump.outputs.tag }}"
          fi
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup-and-bump.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-dependents:
    runs-on: ubuntu-latest
    needs:
      - generate-release
      - setup-and-bump
    steps:
      - name: Notify charge-points-frontend
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.setup-and-bump.outputs.tag }}
        run: |
          gh api repos/watchborne/charge-points-frontend/dispatches \
            -f event_type=electrons-released \
            -f "client_payload[version]=$VERSION"
